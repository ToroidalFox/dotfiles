# LeopardWM Configuration
# https://github.com/jcardama/LeopardWM

[layout]
# Gap between columns in pixels
gap = 4

# Outer gaps at the edges of the viewport in pixels
outer_gap_left = 4
outer_gap_right = 4
outer_gap_top = 4
outer_gap_bottom = 4

# Width presets (fractions of usable viewport width).
width_presets = [0.333, 0.5, 0.667, 0.92, 1]

# Which preset new columns open at (1-based index into width_presets).
# 1 = first preset. Out-of-range values fall back to the first preset.
default_width_preset = 2

# Height presets (fractions of column height / weight).
height_presets = [0.333, 0.5, 0.667]

# Centering mode: "center", "just_in_view", or "on_overflow"
# - center: Always center the focused column
# - just_in_view: Only scroll if focused column would be outside viewport
# - on_overflow: Center only when the column is wider than the viewport
centering_mode = "center"

# Center the only active tiled column when it fits, regardless of centering mode.
center_single_column = false

[appearance]
# Settings, tray, and daemon notification language: bundled locale filename stem (default "en")
language = "en"

[behavior]
# Automatically focus new windows when they appear
focus_new_windows = true

# Windows opening while LeopardWM runs use "opening" (default) or "focused".
# Already-open windows discovered at startup or reload/rescan keep their placement.
# Workspace rules select the workspace index on that monitor for live openings.
# Sticky windows keep their existing placement.
new_window_monitor = "opening"

# Track focus changes from Windows (sync with Alt-Tab, etc.)
# Changes to focus tracking hooks take effect the next time LeopardWM starts.
track_focus_changes = true

# Log level: trace, debug, info, warn, error
log_level = "info"

# Focus follows mouse (hover to focus)
focus_follows_mouse = false

# Disable Windows 11 Snap Layouts for tiled windows (also disables maximize button)
disable_snap_layouts = true

# Check GitHub Releases once a day for a newer version. One anonymous HTTPS GET to
# api.github.com on startup + every 24h. Disable to skip entirely.
# check_for_updates = false

# Animate Chromium / Electron / Mozilla / Cascadia / .NET windows via DWM
# thumbnails instead of per-frame SetWindowPos during column scrolls. Eliminates
# the 1px wobble and renderer stutter on apps that repaint poorly under
# per-frame moves (Chrome, Edge, Slack, Discord, Beeper, Spotify, VS Code,
# Firefox, Windows Terminal, and .NET Framework WinForms/WPF apps).
# Default on since v0.1.18. Set to false to fall back to the legacy
# per-frame SetWindowPos path.
# swap_chain_ghost_animation = false

# Keep visible floating and sticky floating windows above tiled windows without
# activating them. Relative ordering only, not native topmost; skipped during
# fullscreen and overview. Default false.
# Requires track_focus_changes = true (the default). Restart LeopardWM after
# changing that setting; turning it off also stops re-raises immediately on reload.
floating_above_tiled = true

# Where newly opened windows go: "new_column" (default, own column to the
# right) or "in_column" (stacked into the focused column).
# new_window_placement = "new_column"

# Taskbar buttons: "hide_offscreen" (default, hide inactive workspaces and
# scrolled-offscreen windows), "hide_inactive_workspaces" (keep every button
# on each monitor's active workspace), or "show_all". Floating and minimized
# windows keep their buttons on the active workspace in every mode.
taskbar_buttons = "hide_inactive_workspaces"

# Wrap vertical focus/move at a column's top or bottom edge into the adjacent
# workspace. When on, focus_up/focus_down at the edge switch workspaces and
# move_window_up/move_window_down at the edge move the window there. Default false.
# workspace_edge_wrap = false

# Skip empty workspaces for prev/next and edge-wrap focus on this monitor.
# Tiled, floating and minimized windows count; sticky windows do not.
# No other occupied workspace means no change. Window moves are unaffected.
# skip_empty_workspaces = false

# Warp the mouse cursor onto the focused window after a focus-navigation command
# (the inverse of focus_follows_mouse). Default false.
# mouse_follows_focus = false

# When a window is fullscreen, carry fullscreen to the next focused window
# (monocle mode) instead of dropping to the tiled layout. Turn off so fullscreen
# only affects the one window it was toggled on. Default true.
# fullscreen_follows_focus = true

[hotkeys]
# Focus
"Win+S" = "focus_left"
"Win+F" = "focus_right"
"Win+E" = "focus_up"
"Win+D" = "focus_down"
"Win+Home" = "focus_start"
"Win+End" = "focus_end"

# Move column
"Win+Shift+S" = "move_column_left"
"Win+Shift+F" = "move_column_right"
# "Ctrl+Alt+Shift+Home" = "move_column_to_start"
# "Ctrl+Alt+Shift+End" = "move_column_to_end"

# Move window to adjacent column
"Win+G" = "move_window_left"
# "Ctrl+Alt+]" = "move_window_right"

# Expel window to a new column
# "Ctrl+Alt+Shift+[" = "expel_to_left"
"Win+Shift+G" = "expel_to_right"

# Stack the neighbor's window into the focused column
# "Ctrl+Alt+," = "consume_from_left"
# "Ctrl+Alt+." = "consume_from_right"

# Move window within column
"Win+Shift+E" = "move_window_up"
"Win+Shift+D" = "move_window_down"

# Column width
"Win+Shift+R" = "cycle_width_down"
"Win+R" = "cycle_width_up"
# "Ctrl+Alt+0" = "equalize_widths"

# Window height
# "Ctrl+Alt+Shift+-" = "cycle_height_down"
# "Ctrl+Alt+Shift+=" = "cycle_height_up"
# "Ctrl+Alt+Shift+0" = "equalize_heights"

# Monitor focus
# "Ctrl+Alt+Win+," = "focus_monitor_left"
# "Ctrl+Alt+Win+." = "focus_monitor_right"
# "Ctrl+Alt+Win+Up" = "focus_monitor_up"
# "Ctrl+Alt+Win+Down" = "focus_monitor_down"

# Move window to monitor
"Ctrl+Alt+Win+Shift+," = "move_to_monitor_left"
"Ctrl+Alt+Win+Shift+." = "move_to_monitor_right"
"Ctrl+Alt+Win+Shift+Up" = "move_to_monitor_up"
"Ctrl+Alt+Win+Shift+Down" = "move_to_monitor_down"

# Column layout
# "Ctrl+Alt+C" = "center_column"
# "Ctrl+Alt+M" = "maximize_column"

# Window
"Win+Q" = "close_window"
"Win+Space" = "toggle_floating"
"Win+M" = "toggle_fullscreen"
# "Ctrl+Alt+T" = "toggle_tabbed"
# "Ctrl+Alt+S" = "scratchpad_toggle"
# "Ctrl+Alt+Shift+S" = "scratchpad_stash"
# "Ctrl+Alt+Y" = "toggle_sticky"

# Session
# "Ctrl+Alt+P" = "toggle_pause"
# "Ctrl+Alt+R" = "refresh"
# "Ctrl+Alt+Shift+R" = "reload"
# "Win+Ctrl+Escape" = "panic_revert"

# Workspaces
"Win+Tab" = "toggle_overview"
"Win+Ctrl+E" = "workspace_prev"
"Win+Ctrl+D" = "workspace_next"

# Move window to workspace
# "Ctrl+Alt+Shift+PageUp" = "move_to_workspace_prev"
# "Ctrl+Alt+Shift+PageDown" = "move_to_workspace_next"

# Switch to workspace
# "Ctrl+Alt+1" = "switch_workspace_1"
# "Ctrl+Alt+2" = "switch_workspace_2"
# "Ctrl+Alt+3" = "switch_workspace_3"
# "Ctrl+Alt+4" = "switch_workspace_4"
# "Ctrl+Alt+5" = "switch_workspace_5"
# "Ctrl+Alt+6" = "switch_workspace_6"
# "Ctrl+Alt+7" = "switch_workspace_7"
# "Ctrl+Alt+8" = "switch_workspace_8"
# "Ctrl+Alt+9" = "switch_workspace_9"

# Move window to workspace
# "Ctrl+Alt+Shift+1" = "move_to_workspace_1"
# "Ctrl+Alt+Shift+2" = "move_to_workspace_2"
# "Ctrl+Alt+Shift+3" = "move_to_workspace_3"
# "Ctrl+Alt+Shift+4" = "move_to_workspace_4"
# "Ctrl+Alt+Shift+5" = "move_to_workspace_5"
# "Ctrl+Alt+Shift+6" = "move_to_workspace_6"
# "Ctrl+Alt+Shift+7" = "move_to_workspace_7"
# "Ctrl+Alt+Shift+8" = "move_to_workspace_8"
# "Ctrl+Alt+Shift+9" = "move_to_workspace_9"

[gestures]
# wheel_swipes = true  # Disable wheel-based swipes without disabling modifier+wheel or native swipes.
# raw_input = false  # Opt in to native Precision Touchpad swipes; restart required.
# Requires Windows three- and four-finger touchpad gestures set to Nothing.
# Touchpad gesture support
enabled = true
swipe_left = "focus_left"
swipe_right = "focus_right"
swipe_up = "focus_up"
swipe_down = "focus_down"
# Startup-only bounded diagnostic capture, in seconds. 0 = off (default).
# Max 120. Requires `lwm stop` then `lwm run`; `lwm reload` does not start a capture.
# Writes %LOCALAPPDATA%\leopardwm\logs\leopardwm-gesture-capture.log and replaces any prior report.
# diagnostic_capture_secs = 0

[snap_hints]
# Visual snap hint overlays during resize
enabled = true
duration_ms = 200
opacity = 128

[animation]
# Animation timing. Durations in milliseconds; 0 = snap instantly.
# easing accepts "linear" | "ease_in" | "ease_out" | "ease_in_out".
layout_duration_ms = 100            # column move / resize / tab changes
workspace_switch_duration_ms = 200  # switching workspaces
scroll_duration_ms = 100            # scrolling a column into view
overview_duration_ms = 200          # overview open/close zoom
easing = "ease_out"
# Skip animations while on battery / Windows power saver (saves power).
# Set false to keep animations on battery. The Windows "show animations"
# accessibility setting is always honored regardless.
reduce_motion_on_battery = false

[overview]
# Workspace overview card bodies: "live" (default) shows DWM window
# previews (last frame for windows on hidden workspaces); "snapshot"
# shows a frame captured right before each window left the screen
# (icon until one exists); "placeholder" keeps the static app-icon
# bodies.
# render = "live"

[workspaces]
# Optional display names for workspaces 1-9, by position. Shown in
# `lwm query workspace` and pushed to bars over IPC. Leave an entry empty
# ("") to keep that workspace's number. Omit the list to name nothing.
# names = ["web", "code", "chat", "media"]

# Built-in example: Firefox / Zen Picture-in-Picture popups draw their own
# square frame, so we override the focus-border corner style to match. Edit
# or remove freely — corner_style accepts "square" | "rounded" | "small_rounded".
[[window_rules]]
match_class = "MozillaDialogClass"
corner_style = "square"

# [[window_rules]]
# match_class = "Chrome_WidgetWin_1"
# match_title = ".*DevTools.*"
# action = "float"

# Ignore small QQ NT helpers using outer sizes in logical pixels, the same units
# as rule width/height. At 100% scaling these equal the window's pixel dimensions;
# at 150%, 600x450 pixels count as 400x300. Put this before broader QQ rules
# (first match wins). Size limits require a class, title, or executable match
# and apply on admission. Ignored windows are re-evaluated on growth or title
# changes; managed windows stay managed.
# [[window_rules]]
# match_executable = "QQ.exe"
# match_max_width = 400
# match_max_height = 300
# action = "ignore"

# Per-app open behavior: open on a workspace (1-9), pin to a column slot
# (open_in_column, 1-based), set the initial column width (viewport fraction),
# maximize the column, or make the window sticky so it follows you across
# workspaces (add action = "float" for a floating overlay instead of a column).
# [[window_rules]]
# match_executable = "spotify.exe"
# open_on_workspace = 5
# column_width = 0.5
# open_maximized = false
#
# [[window_rules]]
# match_executable = "chrome.exe"
# open_in_column = 1
#
# [[window_rules]]
# match_executable = "slack.exe"
# sticky = true
